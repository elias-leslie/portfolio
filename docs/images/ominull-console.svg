<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ominull CyberOps and Threat Nullification Console</title>
  <desc id="desc">Dashboard showing real-time network flow telemetry, ring-0 isolation status, subnet quarantine mesh, and embedded AI copilot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050811"/>
      <stop offset="0.5" stop-color="#0a101f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .hdr { font: 800 24px 'JetBrains Mono', Inter, monospace; fill: #f8fafc; }
      .sub { font: 400 13px 'JetBrains Mono', Inter, monospace; fill: #94a3b8; }
      .metric-val { font: 800 32px 'JetBrains Mono', Inter, monospace; fill: #38bdf8; }
      .metric-lbl { font: 600 12px 'JetBrains Mono', Inter, monospace; fill: #64748b; letter-spacing: 1.5px; }
      .tag { font: 700 11px 'JetBrains Mono', Inter, monospace; fill: #38bdf8; }
      .log { font: 400 12px 'JetBrains Mono', Consolas, monospace; fill: #cbd5e1; }
      .alert-crit { fill: #ef4444; font-weight: 700; }
      .alert-high { fill: #f97316; font-weight: 700; }
      .status-ok { fill: #10b981; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Top Navigation Bar -->
  <rect x="24" y="20" width="1232" height="60" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="1"/>
  <circle cx="56" cy="50" r="10" fill="#06b6d4" filter="url(#glow)"/>
  <text x="78" y="56" class="hdr" style="font-size:20px;letter-spacing:1px;">OMINULL <tspan fill="#38bdf8">//</tspan> CYBEROPS PLATFORM</text>
  <rect x="420" y="34" width="110" height="32" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4"/>
  <text x="438" y="54" class="tag">⚡ LIVE FLEET</text>
  <rect x="542" y="34" width="140" height="32" rx="6" fill="#334155" fill-opacity="0.5"/>
  <text x="558" y="54" class="log" style="fill:#94a3b8">🕸️ TOPOLOGY</text>
  <rect x="694" y="34" width="130" height="32" rx="6" fill="#334155" fill-opacity="0.5"/>
  <text x="710" y="54" class="log" style="fill:#94a3b8">🔍 SCANNER</text>
  <rect x="836" y="34" width="150" height="32" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6"/>
  <text x="852" y="54" class="log" style="fill:#c084fc">🤖 THREAT COPILOT</text>
  <text x="1100" y="55" class="status-ok" style="font-size:12px">● KERNEL ACTIVE</text>

  <!-- Metric Cards -->
  <g transform="translate(24, 96)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="290" height="96" rx="10" fill="url(#panel)" stroke="#334155"/>
    <text x="20" y="32" class="metric-lbl">MANAGED ENDPOINTS</text>
    <text x="20" y="74" class="metric-val">4 <tspan font-size="16" fill="#10b981">/ 4 Online</tspan></text>
    <!-- Card 2 -->
    <rect x="314" y="0" width="290" height="96" rx="10" fill="url(#panel)" stroke="#334155"/>
    <text x="334" y="32" class="metric-lbl">IN-FLIGHT STREAM DPI</text>
    <text x="334" y="74" class="metric-val">12.4k <tspan font-size="16" fill="#38bdf8">Flows/s</tspan></text>
    <!-- Card 3 -->
    <rect x="628" y="0" width="290" height="96" rx="10" fill="url(#panel)" stroke="#334155"/>
    <text x="648" y="32" class="metric-lbl">SUBNET DISCOVERY</text>
    <text x="648" y="74" class="metric-val">38 <tspan font-size="16" fill="#94a3b8">Assets (100%)</tspan></text>
    <!-- Card 4 -->
    <rect x="942" y="0" width="290" height="96" rx="10" fill="url(#panel)" stroke="#334155"/>
    <text x="962" y="32" class="metric-lbl">LATERAL CONTAINMENT</text>
    <text x="962" y="74" class="metric-val" fill="#10b981">0 <tspan font-size="16" fill="#10b981">Mesh Isolated</tspan></text>
  </g>

  <!-- Main Left: Live Flow & Behavioral Anomaly Stream -->
  <g transform="translate(24, 208)">
    <rect x="0" y="0" width="760" height="488" rx="12" fill="url(#panel)" stroke="#334155"/>
    <text x="24" y="36" class="hdr" style="font-size:16px;">LIVE NETWORK FLOW &amp; DPI ANOMALY STREAM</text>
    
    <!-- Table Header -->
    <line x1="24" y1="52" x2="736" y2="52" stroke="#334155"/>
    <text x="24" y="72" class="metric-lbl">TIMESTAMP</text>
    <text x="140" y="72" class="metric-lbl">ENDPOINT</text>
    <text x="260" y="72" class="metric-lbl">DESTINATION / SNI</text>
    <text x="470" y="72" class="metric-lbl">PROCESS / INODE</text>
    <text x="650" y="72" class="metric-lbl">STATUS</text>

    <!-- Rows -->
    <g transform="translate(24, 94)">
      <text x="0" y="0" class="log">14:42:01.218</text>
      <text x="116" y="0" class="log">operator-pc</text>
      <text x="236" y="0" class="log">github.com:443 (TLS 1.3)</text>
      <text x="446" y="0" class="log">git-remote-https</text>
      <text x="626" y="0" class="status-ok">PASS [WFP]</text>
    </g>
    <g transform="translate(24, 134)">
      <text x="0" y="0" class="log">14:42:02.045</text>
      <text x="116" y="0" class="log">dev-ubuntu-vm</text>
      <text x="236" y="0" class="log">10.0.0.1:53 (DNS)</text>
      <text x="446" y="0" class="log">systemd-resolved</text>
      <text x="626" y="0" class="status-ok">PASS [eBPF]</text>
    </g>
    <g transform="translate(24, 174)">
      <text x="0" y="0" class="log">14:42:03.491</text>
      <text x="116" y="0" class="log">macbook-pro</text>
      <text x="236" y="0" class="log">api.example.com:443</text>
      <text x="446" y="0" class="log">curl (PID 8192)</text>
      <text x="626" y="0" class="status-ok">PASS [PF]</text>
    </g>
    <!-- Anomaly Row 1 -->
    <rect x="12" y="196" width="736" height="44" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.3"/>
    <g transform="translate(24, 224)">
      <text x="0" y="0" class="log">14:42:05.109</text>
      <text x="116" y="0" class="log">dev-ubuntu-vm</text>
      <text x="236" y="0" class="log alert-crit">xj829vbnpqlmz019.xyz:443</text>
      <text x="446" y="0" class="log">python3 (PID 9122)</text>
      <text x="626" y="0" class="alert-crit">⚡ DGA (H=4.02)</text>
    </g>
    <!-- Anomaly Row 2 -->
    <rect x="12" y="248" width="736" height="44" rx="6" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-opacity="0.3"/>
    <g transform="translate(24, 276)">
      <text x="0" y="0" class="log">14:42:06.882</text>
      <text x="116" y="0" class="log">operator-pc</text>
      <text x="236" y="0" class="log alert-high">185.220.101.5:8443 (DE)</text>
      <text x="446" y="0" class="log">powershell.exe</text>
      <text x="626" y="0" class="alert-high">⚠ OFF-HOURS C2</text>
    </g>
    <g transform="translate(24, 326)">
      <text x="0" y="0" class="log">14:42:07.410</text>
      <text x="116" y="0" class="log">lxc-150-hub</text>
      <text x="236" y="0" class="log">10.0.0.39:11434</text>
      <text x="446" y="0" class="log">ominull-hub (Copilot)</text>
      <text x="626" y="0" class="status-ok">PASS [LOCAL]</text>
    </g>
  </g>

  <!-- Main Right: Autonomous AI Security Copilot -->
  <g transform="translate(800, 208)">
    <rect x="0" y="0" width="456" height="488" rx="12" fill="url(#panel)" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="456" height="48" rx="12" fill="#8b5cf6" fill-opacity="0.15"/>
    <circle cx="28" cy="24" r="7" fill="#c084fc" filter="url(#glow)"/>
    <text x="46" y="30" class="hdr" style="font-size:15px;fill:#e9d5ff">AUTONOMOUS CYBEROPS COPILOT</text>

    <!-- Chat Box -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="416" height="280" rx="8" fill="#0b1120" stroke="#334155"/>
      <text x="16" y="28" class="tag" style="fill:#a855f7">🤖 SOC FORENSIC BRIEFING</text>
      <text x="16" y="56" class="log">• <tspan fill="#f87171" font-weight="700">ALERT-8F2:</tspan> DGA domain beaconing detected.</text>
      <text x="16" y="80" class="log">• <tspan fill="#38bdf8">MITRE ATT&amp;CK:</tspan> T1071.001, T1041 (C2 Egress)</text>
      <text x="16" y="104" class="log">• <tspan fill="#38bdf8">Target:</tspan> dev-ubuntu-vm (10.0.0.50)</text>
      <text x="16" y="128" class="log">• <tspan fill="#38bdf8">Process Lineage:</tspan> bash (104) → python3 (9122)</text>
      <text x="16" y="160" class="log" fill="#e2e8f0"><tspan font-weight="700" fill="#38bdf8">Recommended Containment:</tspan></text>
      <text x="16" y="184" class="log">1. Execute Ring-0 Host Quarantine via eBPF.</text>
      <text x="16" y="208" class="log">2. Terminate PID 9122 and dump socket inode.</text>
      <text x="16" y="232" class="log">3. Propagate Subnet Mesh drop rule to peers.</text>
    </g>

    <!-- Quick Action Chips -->
    <g transform="translate(20, 364)">
      <rect x="0" y="0" width="198" height="42" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444"/>
      <text x="24" y="26" class="log" fill="#fca5a5" font-weight="700">🛡️ Isolate Host (Ring-0)</text>

      <rect x="218" y="0" width="198" height="42" rx="6" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4"/>
      <text x="238" y="26" class="log" fill="#7dd3fc" font-weight="700">🕸️ Mesh Quarantine</text>
    </g>

    <!-- Input bar -->
    <g transform="translate(20, 420)">
      <rect x="0" y="0" width="416" height="46" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="16" y="28" class="log" fill="#64748b">Ask Threat Copilot (e.g. "Explain DGA anomaly")...</text>
      <rect x="340" y="8" width="66" height="30" rx="6" fill="#8b5cf6"/>
      <text x="358" y="28" class="log" fill="#fff" font-weight="700">Ask</text>
    </g>
  </g>
</svg>
